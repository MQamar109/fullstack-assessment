services:
  - type: web
    name: truck-routing-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: ORS_API_KEY
        sync: false        # set this in the Render dashboard
      - key: ORS_BASE_URL
        value: "https://api.openrouteservice.org"
      - key: CORS_ALLOWED_ORIGINS
        sync: false        # set to your Vercel URL after the frontend deploys
